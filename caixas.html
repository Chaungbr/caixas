<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Caixas</title>
  <meta name="description" content="Caixinhas para guardar o dinheiro das despesas a pagar">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23191917'/%3E%3Crect x='7' y='9' width='8' height='6' rx='1.5' fill='%23fff'/%3E%3Crect x='17' y='9' width='8' height='6' rx='1.5' fill='%2367c08f'/%3E%3Crect x='7' y='17' width='18' height='6' rx='1.5' fill='%23fff' opacity='.55'/%3E%3C/svg%3E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Caixas">
  <style>
/* ───────────── Caixas — tokens ───────────── */
:root {
  color-scheme: light;
  --bg: #f7f7f5; --surface: #ffffff; --surface-2: #f3f2ef; --surface-3: #ebeae6;
  --border: #e8e6e1; --border-strong: #d9d7d0;
  --text: #191917; --text-2: #5c5b56; --text-3: #8f8d86;
  --accent: #191917; --accent-ink: #ffffff;
  --green: #2e8b57; --green-bg: #e9f4ed; --green-soft: #67c08f;
  --amber: #a86a12; --amber-bg: #fbf1de;
  --red: #c0392f; --red-bg: #fbeceb;
  --blue: #2a78d6; --blue-bg: #e9f1fb;
  --gap-ring: var(--surface);
  --shadow-sm: 0 1px 2px rgba(20,20,18,.04);
  --shadow: 0 1px 2px rgba(20,20,18,.04), 0 4px 16px rgba(20,20,18,.05);
  --shadow-lg: 0 10px 40px rgba(20,20,18,.14), 0 2px 6px rgba(20,20,18,.06);
  --radius: 14px; --radius-sm: 10px; --radius-xs: 7px;
  --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --ease: cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #000000; --surface: #141414; --surface-2: #1f1f1f; --surface-3: #2c2c2c;
    --border: #232323; --border-strong: #363636;
    --text: #f5f5f5; --text-2: #b4b4b4; --text-3: #8a8a8a;
    --accent: #f0efec; --accent-ink: #141413;
    --green: #5cc08a; --green-bg: #1d2b22; --green-soft: #5cc08a;
    --amber: #e0a446; --amber-bg: #2e2617;
    --red: #ec7a72; --red-bg: #321d1b;
    --blue: #5b9be6; --blue-bg: #1b2433;
    --shadow-sm: none; --shadow: 0 1px 0 rgba(255,255,255,.02); --shadow-lg: 0 16px 48px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000; --surface: #141414; --surface-2: #1f1f1f; --surface-3: #2c2c2c;
  --border: #232323; --border-strong: #363636;
  --text: #f5f5f5; --text-2: #b4b4b4; --text-3: #8a8a8a;
  --accent: #f0efec; --accent-ink: #141413;
  --green: #5cc08a; --green-bg: #1d2b22; --green-soft: #5cc08a;
  --amber: #e0a446; --amber-bg: #2e2617;
  --red: #ec7a72; --red-bg: #321d1b;
  --blue: #5b9be6; --blue-bg: #1b2433;
  --shadow-sm: none; --shadow: 0 1px 0 rgba(255,255,255,.02); --shadow-lg: 0 16px 48px rgba(0,0,0,.5);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
.num, .money { font-variant-numeric: tabular-nums; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.muted { color: var(--text-2); } .faint { color: var(--text-3); }
.pos { color: var(--green); } .neg { color: var(--red); } .warn { color: var(--amber); }
.hide { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* boot */
.boot { min-height: 100vh; display: grid; place-items: center; }
.boot-logo { width: 36px; height: 36px; border-radius: 10px; background: var(--text); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; transform: scale(.92); } }

/* ───────────── Layout ───────────── */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 18px 14px; border-right: 1px solid var(--border); background: var(--bg); z-index: 40; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 22px; font-weight: 650; font-size: 16px; letter-spacing: -.01em; }
.brand-mark { width: 26px; height: 26px; border-radius: 8px; background: var(--text); position: relative; flex: none; }
.brand-mark::before, .brand-mark::after { content: ''; position: absolute; border-radius: 2px; }
.brand-mark::before { left: 5px; top: 6px; width: 7px; height: 6px; background: var(--bg); box-shadow: 9px 0 0 var(--green-soft); }
.brand-mark::after { left: 5px; top: 14px; width: 16px; height: 6px; background: var(--bg); opacity: .55; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 9px; color: var(--text-2); text-decoration: none; font-weight: 500; transition: background .15s, color .15s; }
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--border); }
.nav a .badge { margin-left: auto; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 16px; }
.user-chip { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; font-weight: 600; font-size: 12px; color: var(--text-2); flex: none; }
.user-chip .nm { font-weight: 550; font-size: 13px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-chip .em { font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-chip > div { min-width: 0; flex: 1; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 14px 32px; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid transparent; }
.top.scrolled { border-bottom-color: var(--border); }
.top h1 { font-size: 18px; font-weight: 650; letter-spacing: -.015em; margin: 0; white-space: nowrap; }
.top .spacer { flex: 1; }
.btn.menu-btn { display: none; }
.page { padding: 8px 32px 64px; max-width: 1280px; width: 100%; animation: fadeUp .28s var(--ease); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } }

.month-sw { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; box-shadow: var(--shadow-sm); }
.month-sw button { border: 0; background: transparent; width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; cursor: pointer; color: var(--text-2); }
.month-sw button:hover { background: var(--surface-2); color: var(--text); }
.month-sw .lbl { min-width: 148px; text-align: center; font-weight: 550; font-size: 13.5px; cursor: pointer; padding: 0 6px; border-radius: 7px; height: 30px; line-height: 30px; }
.month-sw .lbl:hover { background: var(--surface-2); }
.month-sw .lock { color: var(--text-3); margin-left: 4px; vertical-align: -3px; width: 14px; height: 14px; }
.save-ind { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; min-width: 74px; justify-content: flex-end; }
.save-ind .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green-soft); }
.save-ind.busy .dot { background: var(--amber); animation: pulse 1s infinite; }
.save-ind.err .dot { background: var(--red); }

/* ───────────── Base components ───────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-weight: 550; font-size: 13.5px; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, transform .1s, opacity .15s; box-shadow: var(--shadow-sm); text-decoration: none; }
.btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { opacity: .9; }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.danger { color: var(--red); }
.btn.danger.solid { background: var(--red); color: #fff; border-color: var(--red); }
.btn.green { background: var(--green-bg); color: var(--green); border-color: transparent; box-shadow: none; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; }
.btn.icon { width: 36px; padding: 0; }
.btn.sm.icon { width: 30px; }
.btn svg.i { width: 16px; height: 16px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card.pad { padding: 20px; }
.card-h { display: flex; align-items: center; gap: 10px; padding: 16px 20px 0; }
.card-h h2, .sec-h h2 { font-size: 14.5px; font-weight: 620; margin: 0; letter-spacing: -.005em; }
.card-h .sub, .sec-h .sub { color: var(--text-3); font-size: 12.5px; }
.card-h .r, .sec-h .r { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.card-b { padding: 16px 20px 20px; }
.sec-h { display: flex; align-items: center; gap: 10px; margin: 32px 0 12px; flex-wrap: wrap; }
.sec-h:first-child { margin-top: 8px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }

.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.badge svg.i { width: 12px; height: 12px; stroke-width: 2.2; }
.badge.pago, .badge.ok, .badge.recebido { background: var(--green-bg); color: var(--green); }
.badge.pendente, .badge.previsto { background: var(--amber-bg); color: var(--amber); }
.badge.vencido, .badge.bad { background: var(--red-bg); color: var(--red); }
.badge.info { background: var(--blue-bg); color: var(--blue); }
.badge.outline { background: transparent; box-shadow: inset 0 0 0 1px var(--border); }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow-sm); min-width: 0; }
.kpi .l { font-size: 12.5px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.kpi .v { font-size: 22px; font-weight: 650; letter-spacing: -.02em; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.kpi.hero { grid-column: span 2; display: flex; flex-direction: column; justify-content: space-between; }
.kpi.hero .v { font-size: 32px; }

.hero-wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.org-ring { display: flex; align-items: center; gap: 14px; }

/* barra segmentada */
.seg { display: flex; gap: 2px; height: 14px; border-radius: 6px; overflow: hidden; background: transparent; }
.seg.tall { height: 22px; }
.seg > span { display: block; height: 100%; min-width: 3px; border-radius: 3px; transition: flex-grow .4s var(--ease), opacity .15s; cursor: default; }
.seg > span:hover { opacity: .82; }
.seg > .free { background: repeating-linear-gradient(135deg, var(--surface-3) 0 5px, var(--surface-2) 5px 10px); }
.seg > .over { background: repeating-linear-gradient(135deg, var(--red) 0 5px, var(--red-bg) 5px 10px); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; font-size: 12.5px; color: var(--text-2); }
.legend .it { display: flex; align-items: center; gap: 7px; min-width: 0; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend .sw.free { background: repeating-linear-gradient(135deg, var(--surface-3) 0 3px, var(--surface-2) 3px 6px); box-shadow: inset 0 0 0 1px var(--border); }
.legend b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

.prog { height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.prog > span { display: block; height: 100%; border-radius: 999px; transition: width .45s var(--ease); }
.prog.over > span { background: var(--red) !important; }

.alert { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 11px; font-size: 13px; }
.alert svg.i { margin-top: 1px; }
.alert.critical { background: var(--red-bg); color: var(--red); }
.alert.warning { background: var(--amber-bg); color: var(--amber); }
.alert.info { background: var(--blue-bg); color: var(--blue); }
.alert.neutral { background: var(--surface-2); color: var(--text-2); }
.alert b { font-weight: 650; }
.alerts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }

/* listas */
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--border); min-width: 0; }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .d { font-size: 12.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .amt { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.row .acts { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
.row:hover .acts, .row:focus-within .acts { opacity: 1; }
@media (hover: none) { .row .acts { opacity: 1; } }
.ico-tile { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.ico-tile svg.i { width: 17px; height: 17px; }
.ico-tile.lg { width: 44px; height: 44px; border-radius: 13px; }
.ico-tile.lg svg.i { width: 21px; height: 21px; }
.ico-tile.sm { width: 26px; height: 26px; border-radius: 8px; }
.ico-tile.sm svg.i { width: 14px; height: 14px; }
.empty { text-align: center; padding: 40px 20px; color: var(--text-2); }
.empty .ico-tile { margin: 0 auto 14px; background: var(--surface-2); color: var(--text-2); width: 46px; height: 46px; border-radius: 14px; }
.empty h3 { margin: 0 0 6px; font-size: 15px; color: var(--text); font-weight: 620; }
.empty p { margin: 0 auto 16px; max-width: 420px; font-size: 13.5px; }
.day-h { font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; padding: 18px 0 4px; }

/* tabela */
.tbl-wrap { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 550; font-size: 12px; color: var(--text-3); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tfoot td { font-weight: 650; border-top: 1px solid var(--border-strong); border-bottom: 0; }
.tbl th:first-child, .tbl td:first-child { padding-left: 0; }
.tbl th:last-child, .tbl td:last-child { padding-right: 0; }
.cell-box { display: flex; align-items: center; gap: 10px; }

/* ───────────── Caixas ───────────── */
.boxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.box { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 16px 14px; box-shadow: var(--shadow-sm); cursor: pointer; transition: box-shadow .2s, transform .2s var(--ease), border-color .2s; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.box:hover { box-shadow: var(--shadow); border-color: var(--border-strong); }
.box::before { content: ''; position: absolute; left: 16px; right: 16px; top: -1px; height: 2px; border-radius: 0 0 2px 2px; background: var(--c); opacity: .9; }
.box-h { display: flex; align-items: center; gap: 11px; min-width: 0; }
.box-h .nm { font-weight: 620; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -.005em; }
.box-h .tp { font-size: 12px; color: var(--text-3); }
.box-h > div:not(.ico-tile) { min-width: 0; flex: 1; }
.box .saldo { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.box .saldo .v { font-size: 21px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.box .saldo .l { font-size: 12px; color: var(--text-3); }
.box .meta-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: 12px; }
.box .meta-row .l { color: var(--text-3); }
.box .meta-row .v { font-weight: 580; font-variant-numeric: tabular-nums; font-size: 12.5px; }
.box .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--text-3); min-height: 22px; }
.grip { cursor: grab; color: var(--text-3); width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; touch-action: none; border: 0; background: transparent; margin: -4px -6px -4px 0; }
.grip:hover { background: var(--surface-2); color: var(--text); }
.box.dragging { opacity: .9; box-shadow: var(--shadow-lg); transform: scale(1.02); z-index: 10; cursor: grabbing; }
.box.ph { border-style: dashed; background: var(--surface-2); box-shadow: none; }
.box.add { border-style: dashed; background: transparent; box-shadow: none; align-items: center; justify-content: center; color: var(--text-2); min-height: 180px; }
.box.add:hover { background: var(--surface); color: var(--text); }
.type-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; font-weight: 550; cursor: pointer; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { color: var(--text); border-color: var(--border-strong); }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip .n { opacity: .6; font-variant-numeric: tabular-nums; }

/* compact box list on dashboard */
.mini-box { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); cursor: pointer; }
.mini-box:first-child { border-top: 0; }
.mini-box .grow { flex: 1; min-width: 0; }
.mini-box .top-l { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.mini-box .nm { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ───────────── Cartões ───────────── */
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.ccard { border-radius: 16px; padding: 18px; background: var(--surface); border: 1px solid var(--border); cursor: pointer; position: relative; overflow: hidden; transition: box-shadow .2s, border-color .2s; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 14px; }
.ccard:hover { box-shadow: var(--shadow); }
.ccard.on { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
.ccard .stripe { position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--c); }
.ccard .h { display: flex; align-items: center; gap: 10px; }
.ccard .h .nm { font-weight: 620; }
.ccard .total { font-size: 24px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.ccard .dates { display: flex; gap: 16px; font-size: 12px; color: var(--text-3); }
.ccard .dates b { color: var(--text-2); font-weight: 550; }
.proj-bars { display: flex; align-items: flex-end; gap: 10px; height: 120px; padding-top: 8px; }
.proj-bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; min-width: 0; }
.proj-bars .bar { width: 100%; max-width: 44px; border-radius: 4px 4px 0 0; background: var(--c, var(--text-3)); min-height: 2px; transition: height .4s var(--ease); }
.proj-bars .lb { font-size: 11.5px; color: var(--text-3); }
.proj-bars .vl { font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ───────────── Calendário ───────────── */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--border); border-left: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.cal .wd { padding: 8px 10px; font-size: 11.5px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--surface-2); }
.cal .d { min-height: 104px; padding: 6px 7px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--surface); cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0; transition: background .15s; }
.cal .d:hover { background: var(--surface-2); }
.cal .d.out { background: var(--bg); cursor: default; }
.cal .d.sel { box-shadow: inset 0 0 0 2px var(--text); }
.cal .d .n { font-size: 12px; font-weight: 600; color: var(--text-2); width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }
.cal .d.today .n { background: var(--accent); color: var(--accent-ink); }
.ev { display: flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 2px 6px; border-radius: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; background: var(--surface-2); color: var(--text-2); min-width: 0; }
.ev .dt { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.ev span.tx { overflow: hidden; text-overflow: ellipsis; }
.ev.pago, .ev.recebido { background: var(--green-bg); color: var(--green); }
.ev.pendente, .ev.previsto { background: var(--amber-bg); color: var(--amber); }
.ev.vencido { background: var(--red-bg); color: var(--red); }
.ev.info { background: var(--blue-bg); color: var(--blue); }
.ev.more { background: transparent; color: var(--text-3); padding-left: 2px; }
.cal-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }

/* ───────────── Charts ───────────── */
.chart { width: 100%; display: block; overflow: visible; }
.chart text { font-family: var(--font); font-size: 11px; fill: var(--text-3); font-variant-numeric: tabular-nums; }
.chart .grid-l { stroke: var(--border); stroke-width: 1; }
.chart .axis-l { stroke: var(--border-strong); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .hit:hover { fill: var(--text); fill-opacity: .04; }
.chart .mk:hover { opacity: .82; }
.hbar { display: grid; grid-template-columns: minmax(90px, 160px) minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; font-size: 13px; }
.hbar .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.hbar .tr { height: 10px; border-radius: 0 4px 4px 0; background: transparent; position: relative; }
.hbar .fl { height: 100%; border-radius: 0 4px 4px 0; transition: width .5s var(--ease); min-width: 2px; }
.hbar .v { font-variant-numeric: tabular-nums; font-weight: 580; text-align: right; white-space: nowrap; }
.pv { display: grid; grid-template-columns: minmax(90px, 170px) minmax(0, 1fr) auto; gap: 12px 14px; align-items: center; font-size: 13px; }
.pv .bars { display: flex; flex-direction: column; gap: 3px; }
.pv .bars span { display: block; height: 7px; border-radius: 0 4px 4px 0; min-width: 2px; }
.pv .bars .pl { background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--border-strong); }
#tooltip { position: fixed; z-index: 1000; pointer-events: none; background: var(--text); color: var(--bg); padding: 7px 10px; border-radius: 8px; font-size: 12px; line-height: 1.45; box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; max-width: 260px; }
#tooltip.on { opacity: 1; transform: none; }
#tooltip b { font-weight: 650; }
#tooltip .tr { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
#tooltip .sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

/* ───────────── Forms ───────────── */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl-s { font-size: 12.5px; font-weight: 550; color: var(--text-2); }
.field .hint { font-size: 12px; color: var(--text-3); }
.inp, select.inp, textarea.inp { height: 38px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--surface); width: 100%; outline: none; transition: border-color .15s, box-shadow .15s; min-width: 0; }
textarea.inp { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.inp:focus { border-color: var(--text-2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--text) 10%, transparent); }
.inp.money { text-align: right; font-variant-numeric: tabular-nums; }
.inp.sm { height: 32px; font-size: 13px; padding: 0 10px; }
.money-wrap { position: relative; }
.money-wrap::before { content: 'R$'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 13px; pointer-events: none; }
.money-wrap .inp { padding-left: 36px; }
.form { display: flex; flex-direction: column; gap: 16px; }
.form .r2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form .r3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.check { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-size: 13.5px; }
.check input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--text); }
.check .hint { display: block; font-size: 12px; color: var(--text-3); }
.seg-ctl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg-ctl label { border: 1px solid var(--border); border-radius: 10px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; transition: border-color .15s, background .15s; }
.seg-ctl label:hover { border-color: var(--border-strong); }
.seg-ctl input { display: none; }
.seg-ctl label:has(input:checked) { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.seg-ctl .t { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.seg-ctl .d { font-size: 11.5px; color: var(--text-3); line-height: 1.35; }
.icon-pick, .color-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.icon-pick label { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--border); display: grid; place-items: center; cursor: pointer; color: var(--text-2); }
.icon-pick input, .color-pick input[type=radio] { display: none; }
.icon-pick label:has(input:checked) { border-color: var(--text); color: var(--text); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--text); }
.color-pick label { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; position: relative; }
.color-pick label:has(input:checked)::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; box-shadow: 0 0 0 2px var(--text); }
.color-pick .custom { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; border: 1px dashed var(--border-strong); position: relative; display: grid; place-items: center; color: var(--text-3); }
.color-pick .custom input { position: absolute; inset: -8px; width: 44px; height: 44px; opacity: 0; cursor: pointer; }
.err-box { background: var(--red-bg); color: var(--red); border-radius: 9px; padding: 9px 12px; font-size: 13px; }

/* ───────────── Modal ───────────── */
.ov { position: fixed; inset: 0; z-index: 200; background: rgba(15,15,14,.36); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px 16px; overflow-y: auto; animation: fadeIn .18s ease; backdrop-filter: blur(2px); }
@keyframes fadeIn { from { opacity: 0; } }
.modal { width: 100%; max-width: 520px; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-lg); border: 1px solid var(--border); animation: pop .22s var(--ease); display: flex; flex-direction: column; max-height: calc(100vh - 8vh - 16px); }
.modal.wide { max-width: 760px; }
.modal.xl { max-width: 980px; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.985); } }
.modal-h { display: flex; align-items: center; gap: 12px; padding: 18px 22px 4px; }
.modal-h h3 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.01em; flex: 1; min-width: 0; }
.modal-b { padding: 14px 22px 8px; overflow-y: auto; }
.modal-f { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 22px 18px; border-top: 1px solid var(--border); margin-top: 8px; align-items: center; flex-wrap: wrap; }
.modal-f .l { margin-right: auto; }

/* distribuição */
.dist-list { display: flex; flex-direction: column; }
.dist-row { display: grid; grid-template-columns: minmax(0, 1fr) 110px 150px; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); }
.dist-row:first-child { border-top: 0; }
.dist-row .nm { display: flex; align-items: center; gap: 10px; min-width: 0; }
.dist-row .nm .t { font-weight: 560; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dist-row .nm .d { font-size: 12px; color: var(--text-3); }
.dist-row .pl { text-align: right; font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.dist-row .pl button { border: 0; background: none; color: var(--text-3); cursor: pointer; font-size: 11.5px; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.dist-sum { position: sticky; bottom: 0; background: var(--surface); padding: 14px 0 4px; border-top: 1px solid var(--border); margin-top: 6px; }
.dist-sum .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
.dist-sum .nums .l { font-size: 12px; color: var(--text-3); }
.dist-sum .nums .v { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

/* toasts */
#toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 500; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg); animation: pop .2s var(--ease); display: flex; align-items: center; gap: 8px; pointer-events: auto; }
.toast.err { background: var(--red); color: #fff; }

/* auth */
.auth { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
.auth-l { padding: 48px; display: flex; flex-direction: column; justify-content: space-between; background: var(--surface-2); border-right: 1px solid var(--border); }
.auth-l h1 { font-size: 34px; letter-spacing: -.03em; line-height: 1.15; margin: 0 0 14px; font-weight: 680; max-width: 460px; }
.auth-l p { color: var(--text-2); max-width: 420px; margin: 0; font-size: 15px; }
.auth-demo { display: flex; flex-direction: column; gap: 10px; max-width: 420px; }
.auth-demo .box { cursor: default; }
.auth-r { display: grid; place-items: center; padding: 32px 16px; }
.auth-form { width: 100%; max-width: 360px; }
.auth-form h2 { font-size: 22px; letter-spacing: -.02em; margin: 0 0 6px; }
.auth-form .sub { color: var(--text-2); margin: 0 0 24px; }
.auth-form .btn.primary { width: 100%; height: 40px; }
.auth-switch { margin-top: 18px; text-align: center; color: var(--text-2); font-size: 13.5px; }
.auth-switch a { font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.banner { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); margin-bottom: 16px; font-size: 13px; color: var(--text-2); flex-wrap: wrap; }
.banner .grow { flex: 1; min-width: 200px; }
.stat-line { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 13px; }
.stat-line .l { color: var(--text-2); }
.stat-line .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.stat-line.tot { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 10px; }
.stat-line.tot .l { color: var(--text); font-weight: 600; }
.split3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
.split3 > div { background: var(--surface); padding: 12px 14px; }
.split3 .l { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
.split3 .v { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
.dotc { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
.kv .l { font-size: 12px; color: var(--text-3); }
.kv .v { font-weight: 620; font-variant-numeric: tabular-nums; font-size: 15px; }
.settings-sec { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; padding: 24px 0; border-top: 1px solid var(--border); }
.settings-sec:first-child { border-top: 0; padding-top: 8px; }
.settings-sec h3 { margin: 0 0 4px; font-size: 14.5px; font-weight: 620; }
.settings-sec p { margin: 0; color: var(--text-3); font-size: 13px; }
.mobile-scrim { display: none; }
.ta-autosave { width: 100%; border: 0; background: transparent; resize: vertical; min-height: 90px; outline: none; line-height: 1.6; }

/* ───────────── Responsivo ───────────── */
@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-main, .g3 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 272px; transform: translateX(-102%); transition: transform .25s var(--ease); background: var(--surface); box-shadow: var(--shadow-lg); }
  .app.nav-open .side { transform: none; }
  .app.nav-open .mobile-scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 35; }
  .btn.menu-btn { display: inline-flex; }
  .top { padding: 10px 16px; flex-wrap: wrap; gap: 8px; }
  .top h1 { font-size: 16px; }
  .page { padding: 4px 16px 80px; }
  .g2 { grid-template-columns: minmax(0, 1fr); }
  .auth { grid-template-columns: 1fr; }
  .auth-l { display: none; }
  .settings-sec { grid-template-columns: 1fr; gap: 12px; }
  .seg-ctl { grid-template-columns: 1fr 1fr; }
  .top .save-ind { display: none; }
}
@media (max-width: 560px) {
  .kpi.hero { grid-column: span 2; }
  .kpi .v { font-size: 18px; }
  .kpi.hero .v { font-size: 26px; }
  .kpi { padding: 13px 14px; }
  .month-sw .lbl { min-width: 118px; font-size: 13px; }
  .top .act-txt { display: none; }
  .dist-row { grid-template-columns: minmax(0, 1fr) 128px; }
  .dist-row .pl { grid-column: 1; text-align: left; grid-row: 2; }
  .dist-row .inpw { grid-row: 1 / span 2; grid-column: 2; }
  .form .r2, .form .r3 { grid-template-columns: 1fr; }
  .cal .d { min-height: 62px; padding: 4px; }
  .cal .ev .tx { display: none; }
  .cal .ev { padding: 2px 4px; justify-content: center; }
  .cal .wd { padding: 6px 4px; text-align: center; font-size: 10.5px; }
  .modal { border-radius: 16px; }
  .ov { padding: 12px 8px; }
  .modal-h, .modal-b, .modal-f { padding-left: 16px; padding-right: 16px; }
  .split3 { grid-template-columns: 1fr; }
  .hbar, .pv { grid-template-columns: minmax(80px, 110px) minmax(0, 1fr) auto; gap: 8px; }
  .boxes { grid-template-columns: minmax(0, 1fr); }
}
/* iPhone: respeita o entalhe e a barra inferior quando aberto pela Tela de Início */
@supports (padding: env(safe-area-inset-top)) {
  .top { padding-top: max(10px, env(safe-area-inset-top)); }
  .side { padding-top: max(18px, env(safe-area-inset-top)); padding-bottom: max(18px, env(safe-area-inset-bottom)); }
  .page { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
  .auth-r { padding-top: max(32px, env(safe-area-inset-top)); }
}
input, select, textarea { font-size: max(16px, 1em); } /* evita o zoom automático do iPhone ao tocar em campos */
.inp.sm { font-size: 16px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ───────────── Estilo "app de banco" ───────────── */
:root { --pill: #2e8b57; --pill-ink: #ffffff; }
:root[data-theme="dark"] { --pill: #2f9e66; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --pill: #2f9e66; } }

.hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 18px 0 8px; }
.hero.compact { padding: 22px 0 18px; }
.hero-l { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; color: var(--text-2); font-size: 15px; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
.hero-l:hover { color: var(--text); }
.hero-l svg.i { width: 17px; height: 17px; }
.hero-v { font-size: 44px; font-weight: 700; letter-spacing: -.035em; line-height: 1.15; margin: 6px 0 10px; font-variant-numeric: tabular-nums; }
.hero.compact .hero-v { font-size: 36px; margin-bottom: 6px; }
.pill-tag { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; background: var(--surface-2); color: var(--text-2); }
.pill-tag.ok { background: var(--green-bg); color: var(--green); }
.pill-tag.bad { background: var(--red-bg); color: var(--red); }
.pill-tag.neutral { background: var(--green-bg); color: var(--green); opacity: .85; }
.circles { display: grid; grid-template-columns: repeat(4, 84px); justify-content: center; gap: 14px; margin-top: 26px; }
.circ { display: flex; flex-direction: column; align-items: center; gap: 9px; border: 0; background: none; color: var(--text); font-size: 14px; font-weight: 550; cursor: pointer; padding: 0; line-height: 1.2; }
.circ span { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--border-strong); transition: background .15s, transform .1s; }
.circ:hover span { background: var(--surface-2); }
.circ:active span { transform: scale(.94); }
.circ svg.i { width: 22px; height: 22px; stroke-width: 1.9; }

.sec-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 28px 0 12px; }
.sec-row h2 { margin: 0; font-size: 17px; font-weight: 600; color: var(--text-2); letter-spacing: -.01em; }
.sec-row a { font-size: 15px; font-weight: 600; color: var(--green); cursor: pointer; text-decoration: none; }
.flat-card { border: 1px solid var(--border); background: var(--surface); border-radius: 20px; padding: 18px 20px; cursor: pointer; transition: border-color .15s; }
.flat-card:hover { border-color: var(--border-strong); }
.flat-card .l { color: var(--text-2); font-size: 15px; }
.flat-card .v { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.flat-list { border: 1px solid var(--border); background: var(--surface); border-radius: 20px; padding: 4px 18px; }

.lrows { display: flex; flex-direction: column; }
.lrow { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--border); cursor: pointer; min-width: 0; }
.lrow:last-child { border-bottom: 0; }
.lrow:hover .nm { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--border-strong); }
.lrow .grow { flex: 1; min-width: 0; }
.lrow .nm { font-size: 17.5px; font-weight: 550; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .sub { font-size: 13.5px; color: var(--text-3); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .val { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.prog.thin { height: 4px; margin-top: 8px; max-width: 260px; }
.ico-tile.xl { width: 60px; height: 60px; border-radius: 16px; }
.ico-tile.xl svg.i { width: 26px; height: 26px; stroke-width: 1.7; }

.segm { display: flex; background: var(--surface-2); border-radius: 999px; padding: 4px; max-width: 520px; margin: 4px auto 0; }
.segm button { flex: 1; height: 44px; border: 0; border-radius: 999px; background: transparent; color: var(--text-2); font-size: 16px; font-weight: 600; cursor: pointer; transition: background .2s, color .2s; }
.segm button.on { background: var(--bg); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--border-strong); }

.bottom-bar { display: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 52px; padding: 0 26px; border-radius: 999px; border: 0; background: var(--pill); color: var(--pill-ink); font-size: 17px; font-weight: 650; cursor: pointer; white-space: nowrap; }
.pill:active { transform: scale(.97); }
.pill svg.i { width: 19px; height: 19px; stroke-width: 2.2; }
.only-mobile { display: none; }

@media (max-width: 900px) {
  .only-mobile { display: flex; }

  const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  const money = (c) => (S.hide ? 'R$ ••••' : BRL.format((c || 0) / 100));

  function pasteForm(boxId) {
    modal({ title: 'Colar lista de despesas', submit: 'Adicionar despesas', size: 'wide',
      body: `<div class="form"><div class="field"><label>Uma linha por despesa: descrição e valor</label><textarea class="inp" name="text" rows="8" placeholder="SHEIN: 436,05&#10;AIRBNB: 130&#10;total: 566,05" autofocus></textarea><div class="hint">A linha de “total” serve só para conferir a soma.</div></div><div id="pastePrev"></div></div>`,
      onOpen: (f) => { const ta = f.querySelector('textarea'); ta.addEventListener('input', () => {
        const r = parseItemList(ta.value); const sum = r.items.reduce((s, i) => s + i.amount, 0);
        $('#pastePrev', f).innerHTML = !ta.value.trim() ? '' : `<div class="alert ${r.bad.length || (r.total != null && r.total !== sum) ? 'warning' : 'info'}">${icon('info')}<div><b>${r.items.length} despesa(s)</b> · soma ${money(sum)}${r.total != null ? (r.total === sum ? ' — confere com o total' : ` — <b>diferente</b> do total (${money(r.total)})`) : ''}${r.bad.length ? `<br>Não entendi: ${r.bad.map(esc).join(' · ')}` : ''}</div></div>`;
      }); },
      onSubmit: (d) => {
        const r = parseItemList(d.text); if (!r.items.length) throw new Error('Nenhuma despesa encontrada. Use “descrição: valor”, um por linha.');
        r.items.forEach((i) => DB.entries.push({ id: nid(), box_id: boxId, kind: 'gasto', settled_at: null, date: todayISO(), ...i }));
        save(); toast(`${r.items.length} despesa(s) adicionada(s)`); render(false);
      } });
  }
  function payForm(boxId) {
    if (!needBoxes()) return;
    const withOpen = sortedBoxes().filter((b) => stats(b.id).aberto > 0);
    if (!withOpen.length) return toast('Nenhuma caixinha tem despesas a pagar.', 'err');
    const sel = boxId && withOpen.some((b) => b.id === boxId) ? boxId : withOpen[0].id;
    const body = (id) => { const s = stats(id); const out = Math.min(Math.max(s.guardado, 0), s.aberto);
      return `<div class="stat-line"><span class="l">Despesas a pagar</span><span class="v">${money(s.aberto)}</span></div>
        <div class="stat-line"><span class="l">Guardado na caixinha</span><span class="v">${money(s.guardado)}</span></div>
        <div class="stat-line tot"><span class="l">Sai da caixinha</span><span class="v">${money(out)}</span></div>
        ${s.falta ? `<div class="alert warning" style="margin-top:10px">${icon('alert')}<div>Faltavam ${money(s.falta)}: essa parte foi paga com dinheiro de fora da caixinha.</div></div>` : ''}
        ${s.sobra ? `<div class="alert info" style="margin-top:10px">${icon('info')}<div>Sobram ${money(s.sobra)} guardados na caixinha.</div></div>` : ''}`; };
    modal({ title: 'Registrar pagamento', submit: 'Confirmar pagamento',
      body: `<div class="form"><div class="field"><label>Caixinha</label><select class="inp" name="box_id" id="payBox">${withOpen.map((b) => `<option value="${b.id}" ${b.id === sel ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select></div><div id="payInfo">${body(sel)}</div>
        <p class="faint" style="font-size:12.5px;margin:0">As despesas passam para “Despesas já pagas” e o valor guardado sai da caixinha.</p></div>`,
      onOpen: (f) => { $('#payBox', f).addEventListener('change', (e) => { $('#payInfo', f).innerHTML = body(Number(e.target.value)); }); },
      onSubmit: (d) => {
        const id = Number(d.box_id); const s = stats(id); const out = Math.min(Math.max(s.guardado, 0), s.aberto); const today = todayISO();
        s.open.forEach((e) => { e.settled_at = today; });
        if (out > 0) DB.entries.push({ id: nid(), box_id: id, kind: 'retirada', amount: out, description: 'Pagamento', date: today, settled_at: null });
        save(); toast('Pagamento registrado'); render(false);
      } });
  }

  // ───────────── ações ─────────────
  function go(route, id) { location.hash = route === 'caixa' ? `#/caixa/${id}` : `#/${route}`; }
  function setTheme(t) {
    DB.settings.theme = t; save(); try { localStorage.setItem('caixas_theme', JSON.stringify(t)); } catch (e) { /* */ }
    if (t === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
    render(false);
  }
  const ACT = {
    'nav-open': () => $('.app').classList.add('nav-open'), 'nav-close': () => $('.app').classList.remove('nav-open'),
    back: () => go('inicio'),
    'toggle-hide': () => { S.hide = !S.hide; try { localStorage.setItem('caixas_hide', S.hide ? '1' : '0'); } catch (e) { /* */ } render(false); },
    'theme-cycle': () => setTheme({ system: 'light', light: 'dark', dark: 'system' }[DB.settings.theme || 'system']),
    'theme-set': (el) => setTheme(el.dataset.t),
    'box-new': () => boxForm(), 'box-open': (el) => go('caixa', el.dataset.id),
    'box-edit': (el) => boxForm(boxById(el.dataset.id)),
    'box-del': async (el) => { const b = boxById(el.dataset.id); const n = DB.entries.filter((e) => e.box_id === b.id).length;
      if (await confirmDlg(`Excluir a caixinha <b>${esc(b.name)}</b>${n ? ` e os ${n} lançamento(s) dela` : ''}? Isso não pode ser desfeito.`, { ok: 'Excluir', danger: true })) {
        DB.boxes = DB.boxes.filter((x) => x.id !== b.id); DB.entries = DB.entries.filter((e) => e.box_id !== b.id); save(); toast('Caixinha excluída'); go('inicio'); } },
    deposit: (el) => entryForm('deposito', el.dataset.box ? Number(el.dataset.box) : null),
    withdraw: (el) => entryForm('retirada', el.dataset.box ? Number(el.dataset.box) : null),
    expense: (el) => entryForm('gasto', el.dataset.box ? Number(el.dataset.box) : null),
    pay: (el) => payForm(el.dataset.box ? Number(el.dataset.box) : null),
    paste: (el) => pasteForm(Number(el.dataset.box)),
    'entry-edit': (el) => { const e = DB.entries.find((x) => x.id === Number(el.dataset.id)); if (e) entryForm(e.kind, e.box_id, e); },
    'entry-del': async (el) => { const e = DB.entries.find((x) => x.id === Number(el.dataset.id)); if (!e) return;
      if (await confirmDlg(`Excluir “${esc(e.description || 'lançamento')}” (${money(e.amount)})?`, { ok: 'Excluir', danger: true })) { DB.entries = DB.entries.filter((x) => x.id !== e.id); save(); render(false); } },
    'backup-now': () => { download(`caixas-backup-${todayISO()}.json`, JSON.stringify({ app: 'caixas', version: 3, exported_at: new Date().toISOString(), db: DB }, null, 1), 'application/json');
      try { localStorage.setItem('caixas_last_backup', todayISO()); } catch (e) { /* */ } toast('Backup gerado — guarde no app Arquivos ou no iCloud Drive'); if (DB.name) render(false); },
    'backup-restore': () => {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = async () => { const f = inp.files && inp.files[0]; if (!f) return;
        let data; try { data = JSON.parse(await f.text()); } catch (e) { return toast('Arquivo de backup inválido.', 'err'); }
        const db = data && data.app === 'caixas' && data.db && data.db.version === 3 ? data.db : null;
        if (!db || !Array.isArray(db.boxes) || !Array.isArray(db.entries)) return toast('Este arquivo não é um backup desta versão do Caixas.', 'err');
        if (DB.entries.length && !(await confirmDlg('Substituir os dados deste aparelho pelos do backup?', { ok: 'Restaurar', danger: true }))) return;
        DB = db; DB.flags = DB.flags || {}; DB.flags.eloyse = true; save(); toast('Backup restaurado'); root.innerHTML = ''; render(); };
      inp.click();
    },
    csv: () => { const lab = { deposito: 'Depósito', retirada: 'Retirada', gasto: 'Despesa' };
      const cell = (v) => { const s = v == null ? '' : String(v); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
      const rows = [['Data', 'Caixinha', 'Tipo', 'Descrição', 'Valor (R$)', 'Pago em'], ...[...DB.entries].sort((a, b) => a.date.localeCompare(b.date)).map((e) => [fdate(e.date), (boxById(e.box_id) || {}).name, lab[e.kind], e.description, (e.amount / 100).toFixed(2).replace('.', ','), e.settled_at ? fdate(e.settled_at) : ''])];
      download(`caixas-${todayISO()}.csv`, '﻿' + rows.map((r) => r.map(cell).join(';')).join('\r\n'), 'text/csv;charset=utf-8'); },
    'reset-all': async () => { if (await confirmDlg('Apagar <b>todos</b> os dados deste aparelho? Isso não pode ser desfeito.', { ok: 'Apagar tudo', danger: true })) { DB = emptyDb(); DB.flags.eloyse = true; save(); root.innerHTML = ''; render(); } },
  };
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const fn = ACT[el.dataset.act]; if (!fn) return;
    if (el.tagName === 'A' && !el.getAttribute('href')) e.preventDefault();
    if (el.closest('.nav, .side')) $('.app')?.classList.remove('nav-open');
    Promise.resolve(fn(el, e)).catch((ex) => toast(ex.message, 'err'));
  });
  document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.lrow[data-act]')) { e.preventDefault(); e.target.click(); } });

  // ───────────── rotas ─────────────
  function onHash() {
    const h = location.hash.replace(/^#\/?/, '');
    const m = h.match(/^caixa\/(\d+)$/);
    if (m) { S.route = 'caixa'; S.boxId = Number(m[1]); } else S.route = ROUTES[h] ? h : 'inicio';
    closeAllModals(); render(true);
  }
  addEventListener('hashchange', onHash);
  load();
  const t = DB.settings.theme || 'system'; if (t === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  root.innerHTML = ''; onHash();
})();

</script>
</body>
</html>
